# Render Blueprint - deploy backend as a Docker web service
services:
  - type: web
    name: codeconnect-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: RUST_LOG
        value: info
      - key: PORT
        value: "8080"
    healthCheckPath: /health
    autoDeploy: true
